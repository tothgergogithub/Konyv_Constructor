<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyvtár</title>
</head>
<body>
    <h1>Könyvtár</h1>
    <label for="cim">Új könyv hozzáadaása</label>
    <input type="text" id="cim" placeholder="Cím">
    <input type="text" id="szerzo" placeholder="Szerző">
    <input type="number" id="kiadasiEv" placeholder="Kiadási év">
    <input type="number" id="oldalszam" placeholder="Oldalszám">
    <input type="text" id="kategoria" placeholder="Kategória">
    <button id="hozzaad" type="button" onclick="hozzaadKonyv()">Hozzáad</button>
    <br>
    <br>
    <h1>Szürők</h1>
    <label for="szuresCim">Kategória szűrés</label>
    <select id="szuresCim">
    <option value="osszes">Összes kategória</option>
    <option value="fantasy">Fantasy</option>
    <option value="filozofiai_mese">Filozófiai mese</option>
    <option value="distopia">Dístópia</option>
    
</select>
    <table id="tablazat" border="1">
        <thead>
            <tr>
                <th>Cím</th>
                <th>Szerző</th>
                <th>Kiadási év</th>
                <th>Oldalszám</th>
                <th>Kategória</th>
                <th>Kölcsönzés</th>
                <th>Visszahozás</th>
                <th>Állapot</th>
                <th>Törlés</th>
            </tr>
        </thead>
        <tbody id="konyvTablaTorzs">
            <tr>
                <td>Harry Potter és a bölcsek köve</td>
                <td>J. K. Rowling</td>
                <td>1997</td>
                <td>320</td>
                <td>Fantasy</td>
                <td><button id="kolcsonoz0" type="button">Kölcsönöz</button></td>
                <td><button id="visszahoz0" type="button" disabled>Visszahoz</button></td>
                <td id="allapot0">Elérhető</td>
                <td><button id="torol0" type="button" onclick="torolKonyv(0)">Töröl</button></td>
            </tr>
            <tr>
                <td>A kis herceg</td>
                <td>Antoine de Saint-Exupéry</td>
                <td>1943</td>
                <td>96</td>
                <td>Filozófiai mese</td>
                <td><button id="kolcsonoz1" type="button">Kölcsönöz</button></td>
                <td><button id="visszahoz1" type="button" disabled>Visszahoz</button></td>
                <td id="allapot1">Elérhető</td>
                <td><button id="torol1" type="button" onclick="torolKonyv()">Töröl</button></td>
            </tr>
            <tr>
                <td>1984</td>
                <td>George Orwell</td>
                <td>1949</td>
                <td>328</td>
                <td>Dístópia</td>
                <td><button id="kolcsonoz2" type="button">Kölcsönöz</button></td>
                <td><button id="visszahoz2" type="button" disabled>Visszahoz</button></td>
                <td id="allapot2">Elérhető</td>
                
                <td><button id="torol2" type="button" onclick="torolKonyv()">Töröl</button></td>

            </tr>
        </tbody>

    </table>
    <template id="konyvSorSablon">
        <tr>
            <td data-mezo="cim"></td>
            <td data-mezo="szerzo"></td>
            <td data-mezo="kiadasiEv"></td>
            <td data-mezo="oldalszam"></td>
            <td><button type="button" data-gomb="kolcsonoz">Kölcsönöz</button></td>
            <td><button type="button" data-gomb="visszahoz" disabled>Visszahoz</button></td>
            <td data-mezo="allapot">Elérhető</td>
            <td><button type="button" data-gomb="torol">Töröl</button></td>
        </tr>
    </template>
    <br>
    <br>
    <button id="szabadkonyvek" type="button" onclick="szabadkonyvek()">Szabad könyvek</button>
    <p id="megjelen"></p>
    <button id="legregebbi" type="button" onclick="legregebbikonyv()">Legrégebbi könyvek</button>
    <p id="legregebbiMegjelen"></p>
    <button id="legvastagabb" type="button" onclick="legvastagabbkonyv()">Legvastagabb könyvek</button>
    <p id="legvastagabbMegjelen"></p>
    <button id="atlagosOldalszam" type="button" onclick="atlagosOldalszamkonyv()">Átlagos oldalszám</button>
    <p id="atlagosOldalszamMegjelen"></p>

    <script src="main.js"></script>
</body>
</html>
