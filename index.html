<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyvtár</title>
</head>
<body>
    <h1>Könyvtár</h1>
    <label for="cim">Új könyv hozzáadaása</label>
    <input type="text" id="cim" placeholder="Cím">
    <input type="text" id="szerzo" placeholder="Szerző">
    <input type="number" id="kiadasiEv" placeholder="Kiadási év">
    <input type="number" id="oldalszam" placeholder="Oldalszám">
    <button id="hozzaad" type="button">Hozzáad</button>
    <br>
    <br>
    <table id="tablazat" border="1">
        <thead>
            <tr>
                <th>Cím</th>
                <th>Szerző</th>
                <th>Kiadási év</th>
                <th>Oldalszám</th>
                <th>Kölcsönzés</th>
                <th>Visszahozás</th>
                <th>Állapot</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Harry Potter és a bölcsek köve</td>
                <td>J. K. Rowling</td>
                <td>1997</td>
                <td>320</td>
                <td><button id="kolcsonoz0" type="button">Kölcsönöz</button></td>
                <td><button id="visszahoz0" type="button" disabled>Visszahoz</button></td>
                <td id="allapot0">Elérhető</td>
            </tr>
            <tr>
                <td>A kis herceg</td>
                <td>Antoine de Saint-Exupéry</td>
                <td>1943</td>
                <td>96</td>
                <td><button id="kolcsonoz1" type="button">Kölcsönöz</button></td>
                <td><button id="visszahoz1" type="button" disabled>Visszahoz</button></td>
                <td id="allapot1">Elérhető</td>
            </tr>
            <tr>
                <td>1984</td>
                <td>George Orwell</td>
                <td>1949</td>
                <td>328</td>
                <td><button id="kolcsonoz2" type="button">Kölcsönöz</button></td>
                <td><button id="visszahoz2" type="button" disabled>Visszahoz</button></td>
                <td id="allapot2">Elérhető</td>

            </tr>
        </tbody>

    </table>
    <br>
    <br>
    <button id="szabadkonyvek" type="button" onclick="szabadkonyvek()">Szabad könyvek</button>
    <p id="megjelen"></p>
    <button id="legregebbi" type="button" onclick="legregebbikonyv()">Legrégebbi könyvek</button>
    <p id="legregebbiMegjelen"></p>
    <button id="legvastagabb" type="button" onclick="legvastagabbkonyv()">Legvastagabb könyvek</button>
    <p id="legvastagabbMegjelen"></p>
    <button id="atlagosOldalszam" type="button" onclick="atlagosOldalszamkonyv()">Átlagos oldalszám</button>
    <p id="atlagosOldalszamMegjelen"></p>

    <script src="main.js"></script>
</body>
</html>
