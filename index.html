<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyvtár</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Könyvtár</h1>
 
    <label for="cim">Új könyv hozzáadása</label>
    <input type="text" id="cim" placeholder="Cím">
    <input type="text" id="szerzo" placeholder="Szerző">
    <input type="number" id="kiadasiEv" placeholder="Kiadási év">
    <input type="number" id="oldalszam" placeholder="Oldalszám">
    <input type="text" id="kategoria" placeholder="Kategória">
    <div class="search-box">
   
</div>
 
    <button id="hozzaad" type="button" onclick="hozzaadKonyv()">Hozzáad</button>
 
    <br>
    <br>
 
    <h1>Szűrők</h1>
 
    <label for="szuresKategoria">Kategória szűrés</label>
    <select id="szuresKategoria">
        <option value="osszes">Összes kategória</option>
        <option value="Fantasy">Fantasy</option>
        <option value="Filozófiai mese">Filozófiai mese</option>
        <option value="Dístópia">Dístópia</option>
    </select>
 
    <table id="tablazat" border="1">
        <thead>
            <tr>
                <th>Cím</th>
                <th>Szerző</th>
                <th>Kiadási év</th>
                <th>Oldalszám</th>
                <th>Kategória</th>
                <th>Kölcsönzés</th>
                <th>Visszahozás</th>
                <th>Állapot</th>
                <th>Törlés</th>
            </tr>
        </thead>
        <tbody id="konyvTablaTorzs"></tbody>
    </table>
 
    <br>
    <br>
 
    <button id="szabadkonyvek" type="button" onclick="frissSzabadkonyvek()">Szabad könyvek</button>
    <p id="megjelen"></p>
 
    <button id="legregebbi" type="button" onclick="legregebbikonyv()">Legrégebbi könyv</button>
    <p id="legregebbiMegjelen"></p>
 
    <button id="legvastagabb" type="button" onclick="legvastagabbkonyv()">Legvastagabb könyv</button>
    <p id="legvastagabbMegjelen"></p>
 
    <button id="atlagosOldalszam" type="button" onclick="atlagosOldalszamkonyv()">Átlagos oldalszám</button>
    <p id="atlagosOldalszamMegjelen"></p>
 
 
    <script src="main.js"></script>
</body>
</html>
